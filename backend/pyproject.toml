[project]
name = "dicom-viewer-backend"
version = "0.1.0"
description = "DICOMweb (QIDO-RS/WADO-RS) server for the DICOM 3D Web Viewer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.53",
  "pydicom>=3.0,<4",
  "pylibjpeg>=2.1",
  "pylibjpeg-openjpeg>=2.0",
  "pylibjpeg-rle>=2.0",
  "pylibjpeg-libjpeg>=2.0",
  "numpy>=2.0",
  "pillow>=11",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.28", "ruff>=0.16", "mypy>=2.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
